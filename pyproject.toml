[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coletor-artigos"
version = "1.0.0"
description = "Coletor multibase de artigos científicos (CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "ollama>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["coletor*"]

[tool.setuptools.data-files]
"share/coletor-artigos/web" = ["web/index.html", "web/login.html", "web/styles.css", "web/forms.css", "web/model.css", "web/login.css", "web/login.js", "web/session.css", "web/app.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["online: testes que acessam a internet (fora da execução padrão)"]
addopts = "-m 'not online'"
